name: deploy

# Builds the site into plain files and publishes it to GitHub Pages (ahmadnayfeh.com).
# Runs on every push to main, including pushes from the app repositories that
# update files under public/apps/<app>/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Android reads this file to open Reading Marathon invite links in the app.
      # It lives in a dot-folder, so make sure it reached the output.
      - name: Check required files
        run: |
          test -f out/.well-known/assetlinks.json
          test -f out/index.html
          test -f out/ar/index.html
          test -f out/apps/shasha/latest.json
          test -f out/apps/voxa/latest.json
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
